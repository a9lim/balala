[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "balala"
dynamic = ["version"]
description = "One command for modded Balatro: installs lovely, Steamodded and Amulet, installs and updates mods from a link, and launches the game."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "a9lim", email = "mx@a9l.im" }, { name = "Claude" }]
keywords = ["balatro", "mod-manager", "steamodded", "lovely", "modding", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Games/Entertainment",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/a9lim/balala"
Issues = "https://github.com/a9lim/balala/issues"

[project.scripts]
balala = "balala:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[tool.hatch.version]
path = "balala.py"

[tool.hatch.build.targets.wheel]
only-include = ["balala.py"]

[tool.hatch.build.targets.sdist]
include = ["balala.py", "tests/", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: talks to GitHub (deselect with -m 'not network')"]
